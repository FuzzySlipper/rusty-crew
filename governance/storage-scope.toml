# Draft storage-scope ownership map for Rusty Crew.
#
# This file is intentionally ahead of enforcement. It gives future boundary
# smokes a stable source for table/module ownership while core-persistence is
# split into repository modules.

[[scope]]
id = "storage_admin"
label = "Storage Admin"
owns = [
  "schema_migrations",
  "runtime_import_batches",
  "legacy_id_mappings",
  "rusty_crew_storage_metadata",
  "agent_correlated_rounds_v39",
]
notes = "Migrations, backend diagnostics, maintenance, logical import/export batch metadata, and explicitly named migration-only rebuild tables."

[[scope]]
id = "sessions_identities"
label = "Sessions And Identities"
owns = [
  "agents",
  "agent_identities",
  "agent_instances",
  "sessions",
  "session_identity",
  "session_identities",
  "session_configs",
]
notes = "Durable agent, instance, session, and immutable session config records."

[[scope]]
id = "events_projections"
label = "Events And Body Projections"
owns = [
  "event_history",
  "event_index",
  "event_session_index",
  "event_agent_index",
  "event_instance_index",
  "event_correlation_index",
  "event_wake_index",
  "body_projections",
]
notes = "Append-only events and restart hydration projections."

[[scope]]
id = "queues_messages"
label = "Queues And Messages"
owns = [
  "agent_routes",
  "agent_messages",
  "agent_message_delivery_receipts",
  "agent_correlated_rounds",
  "queued_messages",
]
notes = "Stable routing aliases, internal messages, queued messages, TTL expiry, terminal state, no-resurrection policy."

[[scope]]
id = "scheduler_jobs"
label = "Scheduler Jobs"
owns = [
  "scheduled_jobs",
  "scheduled_job_runs",
]
notes = "Scheduled jobs, run claims, stale claim expiry, and manual run requests."

[[scope]]
id = "worker_runs_completions"
label = "Worker Runs And Completions"
owns = [
  "worker_runs",
  "worker_pool_members",
  "worker_pool_work_items",
  "worker_pool_leases",
  "worker_pool_events",
  "completion_packets",
  "delegated_fan_out_groups",
]
notes = "Worker/delegated run state, worker pool state, completion packets, delegation lineage, fan-out groups."

[[scope]]
id = "provider_state"
label = "Provider State"
owns = [
  "provider_wire_states",
]
notes = "Provider wire-state payloads, expiry, invalidation, and diagnostics."

[[scope]]
id = "logical_turn_continuations"
label = "Logical Turn Continuations"
owns = [
  "logical_brain_turns",
  "logical_brain_turn_checkpoints",
  "logical_brain_turn_operations",
  "logical_brain_turn_projection_outbox",
  "logical_brain_turn_tickets",
  "logical_brain_turn_cancel_receipts",
  "logical_brain_turn_blobs",
]
notes = "Rust-owned logical turn lifecycle, immutable continuation checkpoints, resumable tickets, cancellation fences, frozen input blobs, operations, and idempotent projection outbox records."

[[scope]]
id = "external_agent_runtime"
label = "External Agent Runtime"
owns = [
  "external_runtime_registrations",
  "external_runtime_probe_evidence",
  "external_runtime_certifications",
  "external_controller_leases",
  "external_agent_bindings",
  "external_agent_session_creations",
  "external_turns",
  "external_control_receipts",
  "external_interactions",
  "external_runtime_events",
  "external_runtime_event_cursors",
  "external_runtime_event_checkpoints",
  "external_correlated_rounds",
]
notes = "External runtime registrations, private compatibility probe evidence, durable certification history, exclusive controller generations, idempotent agent-session creation, Crew/native identity correlation, turn/control/interaction state, normalized replay events with monotonic cursors and terminal-turn retention checkpoints, and the retired pre-runtime-neutral round migration table."

[[scope]]
id = "profile_registry"
label = "Profile Registry And Config"
owns = [
  "profile_registry",
  "model_providers",
  "service_credentials",
]
notes = "Active profile registry, DB-backed prompt fields, model provider aliases, shared service credentials, profile import/export metadata."

[[scope]]
id = "bindings"
label = "Bindings"
owns = [
  "mcp_bindings",
  "channel_bindings",
]
notes = "MCP, channel, adapter, and external binding records scoped by profile/session/agent."

[[scope]]
id = "conversations_attachments"
label = "Conversations And Attachments"
owns = [
  "message_slots",
  "messages",
  "message_blocks",
  "message_variants",
  "conversation_branches",
  "conversation_branch_state",
  "conversation_snapshots",
  "attachments",
  "attachment_links",
  "data_bank_scopes",
  "chat_events",
  "chat_message_ingest_receipts",
]
notes = "Transcripts, branch state, message variants, attachments, data-bank scopes, and bounded chat-ingest idempotency receipts."

[[scope]]
id = "memory_lore_modules"
label = "Memory, Lore, And Modules"
owns = [
  "profile_memories",
  "memory_spaces",
  "memory_proposals",
  "memory_governance_decisions",
  "session_memory_records",
  "module_schema_registry",
  "module_schema_versions",
]
generated_prefixes = [
  "module_",
  "idx_module_",
  "trg_module_",
]
notes = "Dense/profile memory, typed memory spaces, roleplay lore, module registry records, and generated module-owned tables."

[[scope]]
id = "telemetry_search"
label = "Telemetry And Search"
owns = [
  "runtime_activities",
  "runtime_counters",
  "runtime_search_fts",
  "runtime_search_entries",
  "tool_call_history",
  "session_activity_digests",
  "context_compaction_artifacts",
]
notes = "Runtime activity accounting, counters, runtime search/read models, tool telemetry, context artifacts, and query catalog support."

[rules]
sql_outside_core_persistence = "forbidden"
typescript_raw_sql = "forbidden"
den_as_crew_storage = "forbidden"
dynamic_physical_names = "must_be_whitelisted_or_descriptor_generated"
module_tables = "must_use_module_schema_registry_descriptors"
queue_import = "must_not_resurrect_expired_or_terminal_work"
test_only_tables = [
  "partial_migration_marker",
]
